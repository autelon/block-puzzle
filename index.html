<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>블록 퍼즐</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="start-screen" class="screen">
    <h1>블록 퍼즐</h1>
    <button id="start-button" type="button">시작</button>
  </section>

  <section id="play-screen" class="screen" hidden>
    <header class="hud">
      <div>점수 <strong id="score">0</strong></div>
    </header>
    <div id="board" class="board"></div>
    <div id="tray" class="tray"></div>

    <div id="over-dialog" class="dialog" hidden>
      <div class="dialog-box">
        <h2>끝</h2>
        <p>최종 점수 <strong id="final-score">0</strong></p>
        <button id="over-restart" type="button">재시작</button>
        <button id="over-quit" type="button" class="secondary">종료</button>
      </div>
    </div>
  </section>

  <script type="module" src="ui.js"></script>
</body>
</html>
